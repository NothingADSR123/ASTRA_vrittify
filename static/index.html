<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA MVP - Assignment Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">ASTRA MVP</h1>
            <p class="text-gray-600">Heuristic + RAG Explainability System</p>
        </header>

        <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8 mb-8">
            <form id="uploadForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Student ID</label>
                    <input type="text" name="student_id" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Assignment File (Image/PDF)</label>
                    <input type="file" name="file" accept=".png,.jpg,.jpeg,.pdf" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md font-semibold hover:bg-blue-700 transition duration-200">
                    Analyze Assignment
                </button>
            </form>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center space-y-4 mb-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
            <p class="text-gray-600">Processing assignment... (OCR + Stylometry + RAG)</p>
        </div>

        <div id="results" class="hidden max-w-4xl mx-auto space-y-6">
            <div class="bg-white rounded-xl shadow-md p-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Analysis Results</h2>
                    <span id="riskBadge" class="px-4 py-1 rounded-full text-sm font-bold uppercase"></span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <p class="text-sm text-blue-600 font-semibold mb-1">AI Likelihood</p>
                        <p id="aiScore" class="text-2xl font-bold text-blue-800"></p>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <p class="text-sm text-purple-600 font-semibold mb-1">Handwriting Similarity</p>
                        <p id="hwScore" class="text-2xl font-bold text-purple-800"></p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-lg">
                        <p class="text-sm text-orange-600 font-semibold mb-1">Suspicion Score</p>
                        <p id="suspicionScore" class="text-2xl font-bold text-orange-800"></p>
                    </div>
                </div>

                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-gray-800 mb-3">Expert Explanation (RAG)</h3>
                    <div id="explanation" class="bg-gray-50 p-6 rounded-lg text-gray-700 whitespace-pre-line border border-gray-200"></div>
                </div>

                <div id="flagsContainer" class="hidden">
                    <h3 class="text-lg font-semibold text-gray-800 mb-3">System Flags</h3>
                    <ul id="flagsList" class="space-y-2"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                // Display Results
                document.getElementById('aiScore').textContent = (data.ai_likelihood * 100).toFixed(0) + '%';
                document.getElementById('hwScore').textContent = (data.handwriting_similarity * 100).toFixed(0) + '%';
                document.getElementById('suspicionScore').textContent = (data.suspicion_score * 100).toFixed(0) + '%';
                document.getElementById('explanation').textContent = data.explanation;

                const badge = document.getElementById('riskBadge');
                badge.textContent = data.risk_level;
                if (data.risk_level === 'HIGH') {
                    badge.className = 'px-4 py-1 rounded-full text-sm font-bold uppercase bg-red-100 text-red-800';
                } else if (data.risk_level === 'MEDIUM') {
                    badge.className = 'px-4 py-1 rounded-full text-sm font-bold uppercase bg-yellow-100 text-yellow-800';
                } else {
                    badge.className = 'px-4 py-1 rounded-full text-sm font-bold uppercase bg-green-100 text-green-800';
                }

                const flagsList = document.getElementById('flagsList');
                flagsList.innerHTML = '';
                if (data.flags.length > 0) {
                    document.getElementById('flagsContainer').classList.remove('hidden');
                    data.flags.forEach(flag => {
                        const li = document.createElement('li');
                        li.className = 'flex items-center text-red-600';
                        li.innerHTML = `<svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>${flag}`;
                        flagsList.appendChild(li);
                    });
                } else {
                    document.getElementById('flagsContainer').classList.add('hidden');
                }

                document.getElementById('results').classList.remove('hidden');
            } catch (error) {
                alert('Error processing assignment: ' + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
